<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcable Extension</title>
    <style>
      :root {
        --bg-main: #f8fafc;
        --text-main: #0f172a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-main: #0b0f19;
          --text-main: #f8fafc;
          color-scheme: dark;
        }
      }
      html.dark, body.dark {
        --bg-main: #0b0f19;
        --text-main: #f8fafc;
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        width: 360px;
        min-height: 400px;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
