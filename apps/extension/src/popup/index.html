<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcable Extension</title>
    <style>
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --bg-main: #f8fafc;
        --bg-card: #ffffff;
        --bg-subtle: #f1f5f9;
        --border-main: #e2e8f0;
        --border-input: #cbd5e1;
        --text-main: #0f172a;
        --text-sub: #64748b;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-main: #0b0f19;
          --bg-card: #151e2e;
          --bg-subtle: #1e293b;
          --border-main: #243247;
          --border-input: #334155;
          --text-main: #f8fafc;
          --text-sub: #94a3b8;
          color-scheme: dark;
        }
      }
      html.dark, body.dark {
        --bg-main: #0b0f19;
        --bg-card: #151e2e;
        --bg-subtle: #1e293b;
        --border-main: #243247;
        --border-input: #334155;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: var(--font-family);
        background-color: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }
      body {
        width: 360px;
        max-width: 100vw;
        min-height: 400px;
        box-sizing: border-box;
      }
      /* Mobile viewports (e.g. Firefox Android popup sheets) */
      @media (max-width: 360px) {
        body {
          width: 100vw;
          min-width: 100%;
        }
      }
      /* When opened full-width in a tab */
      @media (min-width: 480px) {
        body {
          width: 100%;
          display: flex;
          justify-content: center;
        }
        #root {
          width: 100%;
          max-width: 460px;
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
