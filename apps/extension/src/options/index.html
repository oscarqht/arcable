<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcable Settings</title>
    <style>
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --bg-main: #f8fafc;
        --bg-card: #ffffff;
        --bg-subtle: #f1f5f9;
        --border-main: #e2e8f0;
        --border-input: #cbd5e1;
        --text-main: #0f172a;
        --text-sub: #64748b;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-main: #0b0f19;
          --bg-card: #151e2e;
          --bg-subtle: #1e293b;
          --border-main: #243247;
          --border-input: #334155;
          --text-main: #f8fafc;
          --text-sub: #94a3b8;
          color-scheme: dark;
        }
      }
      html.dark, body.dark {
        --bg-main: #0b0f19;
        --bg-card: #151e2e;
        --bg-subtle: #1e293b;
        --border-main: #243247;
        --border-input: #334155;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: var(--font-family);
        background-color: var(--bg-main);
        background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 60%);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html.dark body, body.dark {
        background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
      }
      /* Custom cozy scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.35);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
