<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcable Settings</title>
    <style>
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --bg-main: #f8fafc;
        --bg-card: #ffffff;
        --bg-subtle: #f1f5f9;
        --border-main: #e2e8f0;
        --border-input: #cbd5e1;
        --text-main: #0f172a;
        --text-sub: #64748b;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-main: #0b0f19;
          --bg-card: #151e2e;
          --bg-subtle: #1e293b;
          --border-main: #243247;
          --border-input: #334155;
          --text-main: #f8fafc;
          --text-sub: #94a3b8;
          color-scheme: dark;
        }
      }
      html.dark, body.dark {
        --bg-main: #0b0f19;
        --bg-card: #151e2e;
        --bg-subtle: #1e293b;
        --border-main: #243247;
        --border-input: #334155;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-family);
        background-color: var(--bg-main);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <script>
      (function() {
        try {
          var isDark = false;
          var stored = localStorage.getItem('arcable_config');
          if (stored) {
            var cfg = JSON.parse(stored);
            if (cfg.theme === 'dark') isDark = true;
            else if (cfg.theme === 'light') isDark = false;
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) isDark = true;
          } else if (localStorage.getItem('arcable_theme') === 'dark') {
            isDark = true;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            isDark = true;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
