name: Bump Version and Tag

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'packages/shared/**'
      - 'apps/extension/**'

permissions:
  contents: write

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Bump minor version
        id: bump
        run: node scripts/bump-version.mjs

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes and tag
        run: |
          git add -A
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_tag }} [skip ci]"
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.new_tag }}"

  release:
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.new_tag }}
    secrets: inherit
