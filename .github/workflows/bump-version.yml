name: Bump Version and Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  bump:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, '[ci skip]') &&
       !contains(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
      skipped: ${{ steps.check.outputs.skipped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Warn when release PAT is missing
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "${RELEASE_PUSH_TOKEN}" ]; then
            echo "::warning::RELEASE_PUSH_TOKEN is not set. Tag-push triggers may not run, but store publish will still run via workflow_run after Bump Version and Tag completes on main."
          fi

      - name: Check for unreleased changes
        id: check
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$latest_tag" ]; then
              commits_since_tag=$(git rev-list "${latest_tag}..HEAD" --count)
              if [ "$commits_since_tag" -eq 0 ]; then
                echo "No new commits since $latest_tag. Skipping version bump."
                echo "skipped=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.check.outputs.skipped != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump minor version
        if: steps.check.outputs.skipped != 'true'
        id: bump
        run: node scripts/bump-version.mjs

      - name: Configure Git
        if: steps.check.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes and tag
        if: steps.check.outputs.skipped != 'true'
        run: |
          git add -A
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_tag }} [skip ci]"
          git pull --rebase origin main
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.new_tag }}"

  release:
    needs: bump
    if: needs.bump.outputs.skipped != 'true' && needs.bump.outputs.new_tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.new_tag }}
    secrets: inherit
